version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: intune_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intune_agent}
      POSTGRES_USER: ${POSTGRES_USER:-intune_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intune_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intune_net

  redis:
    image: redis:7-alpine
    container_name: intune_agent_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intune_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intune_agent_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-intune_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-intune_agent}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:14b
      INTUNEWIN_APPUTIL_EXE: /app/tools/IntuneWinAppUtil.exe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/storage:/app/storage
      - ./tools:/app/tools:ro
    networks:
      - intune_net
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: intune_agent_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - intune_net

volumes:
  pgdata:
  redisdata:

networks:
  intune_net:
    driver: bridge
