services:
  postgres:
    image: postgres:16-alpine
    container_name: intune_agent_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intune_agent}
      POSTGRES_USER: ${POSTGRES_USER:-intune_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intune_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intune_net

  redis:
    image: redis/redis-stack-server:latest
    container_name: intune_agent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intune_net

volumes:
  pgdata:
  redisdata:

networks:
  intune_net:
    driver: bridge
